# Cloud Deploy が作る Cloud Run サービスの定義(宿題1で使います)
#
# ★ 講義で作った <自分の名前>-app とは別のサービスです ★
# Cloud Deploy はこのファイルの内容で「サービス全体」を作り直すため、
# Terraform が管理しているサービスに当てると設定を上書きしてしまいます。
# 宿題では -canary という別サービスに出します。
#
# ★ image の行について ★
# `gcloud deploy releases create --images app=...` で
# 実際のイメージに置き換わります。ここに書いた値はプレースホルダです。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: APP_NAME
spec:
  template:
    spec:
      serviceAccountName: RUN_SA
      containers:
        - image: app
          ports:
            - containerPort: 8080
